name: build-wheels  
on:  
  workflow_dispatch:  
  push:  
    tags: ['v*']  
  
jobs:  
  build:  
    strategy:  
      matrix:  
        os: [windows-latest, ubuntu-latest, macos-latest]  
    runs-on: ${{ matrix.os }}  
    steps:  
      - uses: actions/checkout@v4  
      - uses: actions/setup-python@v5  
        with:  
          python-version: '3.12'  
      - name: Build wheel  
        run: |  
          pip install --upgrade pip build cython pybind11  
          python -m build --wheel  
      - uses: actions/upload-artifact@v4  
        with:  
          name: wheel-${{ matrix.os }}  
          path: dist/*.whl  
  
  # 若用 pybind11 C++ 扩展,改用 cibuildwheel 出多版本 wheel:  
  build-cibw:  
    needs: build  
    strategy:  
      matrix:  
        os: [windows-latest, ubuntu-latest, macos-latest]  
    runs-on: ${{ matrix.os }}  
    steps:  
      - uses: actions/checkout@v4  
      - uses: actions/setup-python@v5  
        with:  
          python-version: '3.12'  
      - run: pip install cibuildwheel  
      - run: cibuildwheel --output-dir dist  
        env:  
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"  
          CIBW_BUILD_REQUIRES: "cython pybind11"  
      - uses: actions/upload-artifact@v4  
        with:  
          name: cibw-${{ matrix.os }}  
          path: dist/*.whl  
  
  release:  
    if: startsWith(github.ref, 'refs/tags/')  
    needs: [build, build-cibw]  
    runs-on: ubuntu-latest  
    permissions:  
      contents: write  
    steps:  
      - uses: actions/download-artifact@v4  
        with:  
          pattern: '*'  
          merge-multiple: true  
          path: dist  
      - uses: softprops/action-gh-release@v2  
        with:  
          files: dist/*.whl
